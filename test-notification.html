<!DOCTYPE html>
<html>
<head>
    <title>Тест уведомления</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Тест Telegram уведомления</h1>
    <p>Нажмите кнопку, чтобы отправить тестовое уведомление с данными сегодняшней оплаты</p>
    
    <button onclick="sendNotification()">Отправить уведомление</button>
    
    <div id="result"></div>

    <script>
        async function sendNotification() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Отправка...';
            resultDiv.className = '';
            
            try {
                const response = await fetch('https://functions.poehali.dev/c7e45041-9353-48b0-9496-bc4ae40b911d', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: '1112267464',
                        name: 'Орлова Алёна Владимировна',
                        plan: '3 урока в неделю - 1 месяц',
                        amount: '14400',
                        order_id: 'ORDER_1761820234186'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.textContent = '✅ Уведомление успешно отправлено!\n\n' + JSON.stringify(data, null, 2);
                } else {
                    resultDiv.className = 'error';
                    resultDiv.textContent = '❌ Ошибка: ' + response.status + '\n\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.textContent = '❌ Ошибка: ' + error.message;
            }
        }
    </script>
</body>
</html>
