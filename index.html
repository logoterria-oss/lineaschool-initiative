  <h1>Онлайн-коррекция дислексии и дисграфии для детей 8–18 лет</h1>
  <p>ЛинэяСкул — онлайн-школа коррекции дислексии и дисграфии. Мы работаем с детьми,
  которые читают медленно и по слогам, путают и переставляют буквы, пишут с ошибками
  и не любят читать вслух. Занятия ведут нейрологопеды по авторской методике.</p>
  <h2>С чем мы помогаем</h2>
  <ul>
    <li>Дислексия — трудности чтения: медленный темп, угадывание слов, потеря строки</li>
    <li>Дисграфия — стойкие ошибки на письме, пропуски и замены букв, зеркальное написание</li>
    <li>Дизорфография — ошибки в правилах при их знании</li>
    <li>Нежелание читать, быстрая утомляемость на уроках, снижение успеваемости</li>
  </ul>
  <h2>Как проходят занятия</h2>
  <p>Сначала — комплексное обследование чтения и письма с консультацией специалиста
  за 1290 ₽ вместо 4500 ₽. По его итогам родитель получает заключение и индивидуальный
  план коррекции. Дальше — регулярные онлайн-занятия один на один или в мини-группе,
  с отчётами о динамике. Первые изменения обычно заметны через 2–3 месяца.</p>
  <h2>Почему онлайн</h2>
  <p>Заниматься можно из любого города России и из-за рубежа, без дороги и очередей.
  Нужен только компьютер или планшет с интернетом.</p>
  <p>Записаться на диагностику: <a href="https://lineaschool.ru/">lineaschool.ru</a></p>
